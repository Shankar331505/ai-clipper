name: AI Video Clipper

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Source video URL (YouTube link, etc.)'
        required: true
        type: string

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -U --pre "yt-dlp[default]"

      - name: Set up Node.js (for yt-dlp JS challenge solving)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Deno (for yt-dlp JS challenge solving)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Decode YouTube cookies
        run: echo "${{ secrets.YT_COOKIES_B64 }}" | base64 -d > cookies.txt

      - name: Ingest source video
        run: yt-dlp --no-cache-dir --cookies cookies.txt --extractor-args "youtube:player_client=default,tv" -f "bestvideo[height<=1080]+bestaudio/best[height<=1080]/best" --merge-output-format mp4 -o "source.mp4" "${{ inputs.video_url }}"

      - name: Ingest gameplay video (optional)
        run: |
          if [ -f gameplay ]; then
            GAMEPLAY_URL=$(cat gameplay | tr -d '\r\n')
            if [ ! -z "$GAMEPLAY_URL" ]; then
              if [[ "$GAMEPLAY_URL" == *"youtube.com"* || "$GAMEPLAY_URL" == *"youtu.be"* ]]; then
                echo "Downloading gameplay from YouTube link..."
                yt-dlp --no-cache-dir --cookies cookies.txt --extractor-args "youtube:player_client=default,tv" --download-sections "*00:00-10:00" -f "bestvideo[height<=720]+bestaudio/best[height<=720]/best" --merge-output-format mp4 -o "gameplay.mp4" "$GAMEPLAY_URL" || echo "yt-dlp gameplay download failed, proceeding without gameplay"
              else
                echo "Installing gdown..."
                pip install gdown
                echo "Downloading gameplay from Drive link..."
                gdown "$GAMEPLAY_URL" -O gameplay.mp4 || echo "gdown download failed, proceeding without gameplay"
              fi
            fi
          fi

      - name: Remove cookies file
        if: always()
        run: rm -f cookies.txt

      - name: Transcribe with Whisper (Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/transcribe.py source.mp4 transcript.json

      - name: Detect highlight clips (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/highlight_detect.py transcript.json clips.json

      - name: Cut clips
        run: python scripts/cut_clips.py source.mp4 clips.json transcript.json

      - name: Reframe to 9:16
        run: python scripts/reframe.py

      - name: Burn in captions
        run: python scripts/captions.py

      - name: Generate titles + hashtags
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_metadata.py clips.json metadata.json

      - name: Upload clips to GitHub Release (for public video URLs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/upload_to_release.py metadata.json

      - name: Publish via Buffer
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: python scripts/publish.py metadata.json

      - name: Upload final clips as artifact (backup / debugging)
        uses: actions/upload-artifact@v4
        with:
          name: final-clips
          path: output/*.mp4
          retention-days: 7
