name: AI Video Clipper

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Source video URL (YouTube link, etc.)'
        required: true
        type: string

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -U --pre "yt-dlp[default]"
          pip install -U yt-dlp-ejs

      - name: Set up Node.js (for yt-dlp JS challenge solving)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Deno (for yt-dlp JS challenge solving)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Decode YouTube cookies
        run: echo "${{ secrets.YT_COOKIES_B64 }}" | base64 -d > cookies.txt

      - name: Debug yt-dlp runtimes
        run: yt-dlp -v || true

      - name: Ingest source video
        run: yt-dlp --no-cache-dir --cookies cookies.txt --extractor-args "youtube:player_client=web_safari,web" --remote-components ejs:github -f "bestvideo[height<=1080]+bestaudio/best[height<=1080]/best" --merge-output-format mp4 -o "source.mp4" "${{ inputs.video_url }}"

      - name: Transcribe with Whisper (Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/transcribe.py source.mp4 transcript.json

      - name: Detect highlight clips (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/highlight_detect.py transcript.json clips.json

      - name: Cut clips
        run: python scripts/cut_clips.py source.mp4 clips.json transcript.json

      - name: Reframe to 9:16 (downloads random gameplay per clip)
        run: python scripts/reframe.py

      - name: Remove cookies file
        if: always()
        run: rm -f cookies.txt

      - name: Generate titles + hashtags
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_metadata.py clips.json metadata.json

      - name: Burn in captions
        run: python scripts/captions.py

      - name: Upload clips to GitHub Release (for public video URLs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/upload_to_release.py metadata.json

      - name: Publish via Buffer
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: python scripts/publish.py metadata.json

      - name: Upload final clips as artifact (backup / debugging)
        uses: actions/upload-artifact@v4
        with:
          name: final-clips
          path: output/*.mp4
          retention-days: 7
